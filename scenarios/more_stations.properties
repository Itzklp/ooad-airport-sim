# Scenario 2 of Brown and Madhavan (2011): 2 more agents and 10 more self check-in kiosks per airline.
#
# Same as real_world.properties except for the station counts below (paper, section 4.0 and Table 4):
#   American/Continental 1 + 10 = 11 kiosks, 1 + 2 = 3 counters
#   Southwest and US Airways 4 + 10 = 14 kiosks, 4 + 2 = 6 counters
# Every other value, including the calibrated service times, is copied unchanged from the real-world
# scenario (no tuning). See real_world.properties for where each value comes from.
# All times are in seconds.

name = More stations
note = Station counts, kiosk shares, stop settings and Weibull shapes are assumptions; service means were calibrated to the paper's utilization (the paper prints its parameters as zeros).
runs = 80
seed = 2026
hours = 24

arrival = -0.001 + GAMM(39.2, 1)
checkin.lineRule = random
groups = AC, SW, US

group.AC.name = American/Continental
group.AC.share = 0.0813
group.AC.kioskShare = 0.5
group.AC.kiosks = 11
group.AC.kioskLines = 1
group.AC.kioskTime = 60 + WEIB(593.3, 1.5)
group.AC.counters = 3
group.AC.counterLines = 1
group.AC.counterTime = 54 + EXPO(508.3)

group.SW.name = Southwest
group.SW.share = 0.4846
group.SW.kioskShare = 0.5
group.SW.kiosks = 14
group.SW.kioskLines = 1
group.SW.kioskTime = 60 + WEIB(593.3, 1.5)
group.SW.counters = 6
group.SW.counterLines = 1
group.SW.counterTime = 54 + EXPO(508.3)

group.US.name = US Airways
group.US.share = 0.4341
group.US.kioskShare = 0.5
group.US.kiosks = 14
group.US.kioskLines = 1
group.US.kioskTime = 60 + WEIB(593.3, 1.5)
group.US.counters = 6
group.US.counterLines = 1
group.US.counterTime = 54 + EXPO(508.3)

security.lanes = 2
security.lines = 2
security.lineRule = random
security.time = 10 + WEIB(61.73, 1.5)
security.stopShare = 0.05
security.stopTime = EXPO(120)
