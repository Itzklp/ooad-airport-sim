# Scenario 1 of Brown and Madhavan (2011): the real situation at Norfolk International Airport.
#
# WHERE THE VALUES COME FROM
#   From the paper : the three airline groups; the distribution FAMILIES and constants of its Table 1
#                    (-0.001 + GAMM, 54 + EXPO, 60 + WEIB, 10 + WEIB); two security checkpoints;
#                    80 runs of 24 hours.
#   Derived        : group shares = the paper's average passengers per day (179.14, 1068.43, 957.09)
#                    divided by their total; arrival mean 39.2 s = 86400 s / 2204.66 passengers.
#   ASSUMED        : (the paper does not give these)
#                    - kiosks and counters: 1 + 1 for American/Continental, 4 + 4 for Southwest and
#                      for US Airways. The fewest stations for which no airline's own stations are
#                      loaded above about 0.9 once utilization matches the paper.
#                    - kiosk share 0.5 for every airline (no information, so an even split).
#                    - Weibull shape 1.5 for self check-in and security (a moderate spread).
#                    - security split at random between the two checkpoints (D1 section 3.5).
#                    - stop share 5% and stop time EXPO(120). A stopped passenger is checked aside,
#                      so these do not change waits or utilization.
#   CALIBRATED     : the mean service times (the paper prints them as zeros). Each mean was set from
#                    mean = target utilization x stations / arrival rate, then adjusted once so this
#                    scenario gives the paper's utilization (Table 3): manned 78.40%, self 83.38%,
#                    security 82.43%. With seed 2026 it gives 78.57%, 83.39% and 82.46%.
#                    The values are frozen; scenarios 2 and 3 use them unchanged.
# All times are in seconds.

name = Real world
note = Station counts, kiosk shares, stop settings and Weibull shapes are assumptions; service means were calibrated to the paper's utilization (the paper prints its parameters as zeros).
runs = 80
seed = 2026
hours = 24

arrival = -0.001 + GAMM(39.2, 1)
checkin.lineRule = random
groups = AC, SW, US

group.AC.name = American/Continental
group.AC.share = 0.0813
group.AC.kioskShare = 0.5
group.AC.kiosks = 1
group.AC.kioskLines = 1
group.AC.kioskTime = 60 + WEIB(593.3, 1.5)
group.AC.counters = 1
group.AC.counterLines = 1
group.AC.counterTime = 54 + EXPO(508.3)

group.SW.name = Southwest
group.SW.share = 0.4846
group.SW.kioskShare = 0.5
group.SW.kiosks = 4
group.SW.kioskLines = 1
group.SW.kioskTime = 60 + WEIB(593.3, 1.5)
group.SW.counters = 4
group.SW.counterLines = 1
group.SW.counterTime = 54 + EXPO(508.3)

group.US.name = US Airways
group.US.share = 0.4341
group.US.kioskShare = 0.5
group.US.kiosks = 4
group.US.kioskLines = 1
group.US.kioskTime = 60 + WEIB(593.3, 1.5)
group.US.counters = 4
group.US.counterLines = 1
group.US.counterTime = 54 + EXPO(508.3)

security.lanes = 2
security.lines = 2
security.lineRule = random
security.time = 10 + WEIB(61.73, 1.5)
security.stopShare = 0.05
security.stopTime = EXPO(120)
