# Scenario 3 of Brown and Madhavan (2011): the check-in stations of Southwest and US Airways divided
# into two lines each, "for this case two", so a passenger can choose the shorter line (paper, section 4.0).
#
# Same as real_world.properties except that Southwest and US Airways have 2 kiosk lines and 2 counter lines
# (each line feeds 2 of the 4 stations) and passengers join the shortest line (a tie goes to the first).
# No stations are added. Every other value, including the calibrated service times, is copied unchanged
# from the real-world scenario (no tuning). See real_world.properties for where each value comes from.
# All times are in seconds.

name = Two lines
note = Station counts, kiosk shares, stop settings and Weibull shapes are assumptions; service means were calibrated to the paper's utilization (the paper prints its parameters as zeros).
runs = 80
seed = 2026
hours = 24

arrival = -0.001 + GAMM(39.2, 1)
checkin.lineRule = shortest
groups = AC, SW, US

group.AC.name = American/Continental
group.AC.share = 0.0813
group.AC.kioskShare = 0.5
group.AC.kiosks = 1
group.AC.kioskLines = 1
group.AC.kioskTime = 60 + WEIB(593.3, 1.5)
group.AC.counters = 1
group.AC.counterLines = 1
group.AC.counterTime = 54 + EXPO(508.3)

group.SW.name = Southwest
group.SW.share = 0.4846
group.SW.kioskShare = 0.5
group.SW.kiosks = 4
group.SW.kioskLines = 2
group.SW.kioskTime = 60 + WEIB(593.3, 1.5)
group.SW.counters = 4
group.SW.counterLines = 2
group.SW.counterTime = 54 + EXPO(508.3)

group.US.name = US Airways
group.US.share = 0.4341
group.US.kioskShare = 0.5
group.US.kiosks = 4
group.US.kioskLines = 2
group.US.kioskTime = 60 + WEIB(593.3, 1.5)
group.US.counters = 4
group.US.counterLines = 2
group.US.counterTime = 54 + EXPO(508.3)

security.lanes = 2
security.lines = 2
security.lineRule = random
security.time = 10 + WEIB(61.73, 1.5)
security.stopShare = 0.05
security.stopTime = EXPO(120)
